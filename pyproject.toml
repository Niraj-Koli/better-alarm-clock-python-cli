[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock-cli"
dynamic = ["version"]
description = "A timezone-aware command-line alarm clock"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
alarm = "alarm_clock.cli:main"

[tool.setuptools]
packages = ["alarm_clock"]

[tool.setuptools.dynamic]
version = { attr = "alarm_clock.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
